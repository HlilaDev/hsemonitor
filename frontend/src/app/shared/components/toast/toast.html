@if (toast.toasts().length > 0) {
  <div class="toast-stack">
    @for (item of toast.toasts(); track item.id) {
      <div class="toast-item" [attr.data-type]="item.type">
        <span class="toast-icon">
          @switch (item.type) {
            @case ('success') { <i class="bi bi-check-circle-fill"></i> }
            @case ('error')   { <i class="bi bi-x-circle-fill"></i> }
            @case ('warning') { <i class="bi bi-exclamation-triangle-fill"></i> }
            @default          { <i class="bi bi-info-circle-fill"></i> }
          }
        </span>
        <span class="toast-msg">{{ item.message }}</span>
        <button class="toast-close" type="button" (click)="toast.dismiss(item.id)" aria-label="Fermer">
          <i class="bi bi-x"></i>
        </button>
      </div>
    }
  </div>
}
