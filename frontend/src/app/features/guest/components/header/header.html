<nav class="nav" [class.scrolled]="isScrolled()">
  <div class="container">
    <div class="nav-inner">

      <!-- Brand -->
      <a class="brand" routerLink="/">
        <div class="logo" aria-hidden="true"></div>

        <div class="brand-text">
          <h1>HSE Monitor</h1>
          <p>Plateforme intelligente HSE</p>
        </div>
      </a>

      <!-- Desktop Nav Links -->
      <div class="nav-links" role="navigation" aria-label="Navigation principale">
        @for (link of navLinks; track link.anchor) {
          <button class="nav-link" type="button" (click)="scrollTo(link.anchor)">
            {{ link.label }}
          </button>
        }
      </div>

      <!-- Desktop Actions -->
      <div class="nav-actions">
        @if (!isLoggedIn()) {
          <a class="btn btn-dark" routerLink="/login">
            Connexion
          </a>
        }

        @if (isLoggedIn()) {
          <button class="btn btn-primary" type="button" (click)="goToPlatform()">
            Accéder à la plateforme →
          </button>
        }
      </div>

      <!-- Hamburger Mobile -->
      <button
        class="hamburger"
        type="button"
        [class.open]="isMobileMenuOpen()"
        (click)="toggleMobileMenu()"
        aria-label="Menu"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>

    <!-- Mobile Menu -->
    @if (isMobileMenuOpen()) {
      <div class="mobile-menu">

        @for (link of navLinks; track link.anchor) {
          <button class="nav-link" type="button" (click)="scrollTo(link.anchor)">
            {{ link.label }}
          </button>
        }

        <div class="mobile-actions">
          @if (!isLoggedIn()) {
            <a
              class="btn btn-dark"
              routerLink="/login"
              (click)="toggleMobileMenu()"
            >
              Connexion
            </a>
          }

          @if (isLoggedIn()) {
            <button
              class="btn btn-primary"
              type="button"
              (click)="goToPlatform()"
            >
              Accéder à la plateforme →
            </button>
          }
        </div>
      </div>
    }
  </div>
</nav>
